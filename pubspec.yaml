name: yeo_face_invaders
description: YEO Messaging - Continuous Face Recognition Space Invaders Challenge
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Camera access
  camera: ^0.11.0
  
  # ML inference - TFLite for face recognition
  tflite_flutter: ^0.12.0
  
  # Face detection
  google_mlkit_face_detection: ^0.11.0
  
  # Secure local storage for embeddings
  flutter_secure_storage: ^9.0.0
  
  # Image processing
  image: ^4.1.7
  
  # Permission for camera
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/